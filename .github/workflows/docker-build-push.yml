name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      odoo_version:
        description: 'Odoo version to build'
        required: false
        default: '18.0'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/odoo

jobs:
  build-per-arch:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: linux-amd64
          - platform: linux/arm64
            platform_id: linux-arm64
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine Odoo version
        id: odoo-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.odoo_version }}" >> $GITHUB_OUTPUT
          else
            # Extract from Dockerfile ARG or default to 18.0
            VERSION=$(grep -oP 'ARG ODOO_VERSION=\K[0-9.]+' Dockerfile || echo "18.0")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
          # Extract major version (e.g., 18 from 18.0)
          MAJOR_VERSION=$(echo "${VERSION:-18.0}" | cut -d'.' -f1)
          echo "major_version=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare SSH files for private addon repositories
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.ADDONS_SSH_PRIVATE_KEY }}" ]; then
            echo "ADDONS_SSH_PRIVATE_KEY is not configured; skipping SSH file generation."
            exit 0
          fi

          mkdir -p custom/ssh

          # Doodba expects this key name when config uses IdentityFile ~/.ssh/git
          printf '%s' "${{ secrets.ADDONS_SSH_PRIVATE_KEY }}" > custom/ssh/git
          chmod 600 custom/ssh/git

          if [ -n "${{ secrets.ADDONS_SSH_PUBLIC_KEY }}" ]; then
            printf '%s' "${{ secrets.ADDONS_SSH_PUBLIC_KEY }}" > custom/ssh/git.pub
            chmod 644 custom/ssh/git.pub
          fi

          if [ -n "${{ secrets.ADDONS_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s' "${{ secrets.ADDONS_SSH_KNOWN_HOSTS }}" > custom/ssh/known_hosts
          else
            ssh-keyscan -H github.com > custom/ssh/known_hosts
          fi
          chmod 644 custom/ssh/known_hosts

      - name: Build image for pull requests (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            ODOO_VERSION=${{ steps.odoo-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_id }}

      - name: Build and push by digest (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ODOO_VERSION=${{ steps.odoo-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_id }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_id }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup temporary SSH files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f custom/ssh/git custom/ssh/git.pub custom/ssh/known_hosts

  merge-and-push-manifest:
    name: Merge and Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build-per-arch
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Determine Odoo version
        id: odoo-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.odoo_version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -oP 'ARG ODOO_VERSION=\K[0-9.]+' Dockerfile || echo "18.0")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
          MAJOR_VERSION=$(echo "${VERSION:-18.0}" | cut -d'.' -f1)
          echo "major_version=${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          tags: |
            # Tag with Odoo major version (e.g., 18)
            type=raw,value=${{ steps.odoo-version.outputs.major_version }}
            # Tag with full Odoo version (e.g., 18.0)
            type=raw,value=${{ steps.odoo-version.outputs.version }}
            # Tag with branch name
            type=ref,event=branch
            # Tag with PR number
            type=ref,event=pr
            # Tag with git tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short commit SHA
            type=sha,prefix={{branch}}-
            # Tag as latest on main branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Odoo Docker Image
            org.opencontainers.image.description=Multi-platform Odoo Docker image built with Doodba

      - name: Create and push multi-arch manifest list
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}"

          mapfile -t TAGS <<< "${{ steps.meta.outputs.tags }}"
          tag_args=()
          for tag in "${TAGS[@]}"; do
            [ -n "$tag" ] && tag_args+=("-t" "$tag")
          done

          digest_args=()
          for digest_file in /tmp/digests/*; do
            digest_args+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Generate build summary
        run: |
          echo "## Docker Image Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Odoo Version:** ${{ steps.odoo-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
